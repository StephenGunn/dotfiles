############################
### HYPRLAND CONFIG      ###
############################

# Theme colors
# mocha.conf provides the baseline palette (tracked in git, always present).
# colors.conf is written by theme-switch and overrides a subset of it. Hyprland
# has no optional-source syntax — a source= path that globs to nothing is a
# config error — so link.sh seeds an empty colors.conf on machines that have
# never run theme-switch. Keep both lines unconditional, in this order.
source = $HOME/.config/hypr/mocha.conf
source = $HOME/.config/hypr/colors.conf

# Modular configuration files
source = $HOME/.config/hypr/monitors.conf
source = $HOME/.config/hypr/workspaces.conf
source = $HOME/.config/hypr/appearance.conf
source = $HOME/.config/hypr/input.conf
source = $HOME/.config/hypr/keybinds.conf
source = $HOME/.config/hypr/windowrules.conf
source = $HOME/.config/hypr/streaming.conf
source = $HOME/.config/hypr/autostart.conf
