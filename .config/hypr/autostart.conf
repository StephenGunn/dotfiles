###################
### AUTOSTART   ###
###################

# Wallpaper daemon
exec-once = awww-daemon

# Desktop portals
exec-once = sh .config/hypr/desktop-portals.sh

# Per-monitor launcher
exec-once = sh .config/hypr/per-monitor-launcher.sh

# Idle management
exec-once = hypridle

# Panel
exec-once = quickshell

# Notifications
exec-once = dunst

# Gesture support (restart to pick up new Hyprland socket)
exec-once = systemctl --user restart libinput-gestures

# Get last focused window script
exec = sh .config/hypr/scripts/get-last-focused-window.sh

# EWW daemon
exec = eww daemon

# Cursor theme
exec-once = hyprctl setcursor Bibata-Modern-Ice 28

# Authentication agent (hyprpolkitagent via systemd user service)

# Initialize theme (applies last theme + random wallpaper)
# Logs are written to /tmp/hypr-theme-init.log
exec-once = ~/dotfiles/scripts/hypr-theme-init.sh 2>> /tmp/hypr-theme-init.log

# Pyprland addons — provides the Super+X / Super+Z zoom binds in keybinds.conf.
# Unqualified `pypr` on purpose: the AUR package installs /usr/bin/pypr and a
# pipx install lands in ~/.local/bin, but the old hardcoded /usr/local/bin/pypr
# is a path neither one ever creates, so this line had been failing silently.
exec-once = pypr --debug /tmp/pypr.log

# Clipboard history
exec-once = wl-paste --watch cliphist store
