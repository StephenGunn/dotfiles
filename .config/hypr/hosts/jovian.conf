# Host: jovian (desktop)
# Triple monitor: vertical (left) + main (center) + tiny (right)

################
### MONITORS ###
################

# Vertical monitor (DP-3) - 2560x1440 @ 143Hz, rotated 90° (left)
monitor = DP-3,2560x1440@143,-1440x-510,1,transform,1

# Main monitor (DP-2) - 2560x1440 @ 165Hz (center)
monitor = DP-2,2560x1440@165,0x0,1

# Tiny monitor (HDMI-A-1) - 1280x800, right side near bottom of main
monitor = HDMI-A-1,1280x800@59.81,2560x640,1

######################
### WORKSPACES     ###
######################

# Vertical monitor (DP-3, left) - Workspaces 1-5
workspace = 1, monitor:DP-3, default:true
workspace = 2, monitor:DP-3, default:true
workspace = 3, monitor:DP-3, default:true
workspace = 4, monitor:DP-3, default:true
workspace = 5, monitor:DP-3, default:true

# Main monitor (DP-2, right) - Workspaces 6-10
workspace = 6, monitor:DP-2, default:true
workspace = 7, monitor:DP-2, default:true
workspace = 8, monitor:DP-2, default:true
workspace = 9, monitor:DP-2, default:true
workspace = 10, monitor:DP-2, default:true, layout:scrolling

# Tiny monitor (HDMI-A-1) - Workspaces 11-12
workspace = 11, monitor:HDMI-A-1, default:true
workspace = 12, monitor:HDMI-A-1, default:true

# Astroterm star map on tiny monitor
exec-once = ghostty --title=tiny-monitor-app -e fish -c 'astroterm --city "Kansas City" --color -u'
